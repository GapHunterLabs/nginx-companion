user  www-data;
worker_processes  auto;
pid /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    gzip  on;
    gzip_types text/plain application/json application/javascript text/css;

    upstream api_backend {
        least_conn;
        server 10.0.1.11:8080 weight=3 max_fails=2 fail_timeout=30s;
        server 10.0.1.12:8080 weight=3 max_fails=2 fail_timeout=30s;
        server 10.0.1.13:8080 backup;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name gaphunterlabs.dev www.gaphunterlabs.dev;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name gaphunterlabs.dev www.gaphunterlabs.dev;

        ssl_certificate     /etc/letsencrypt/live/gaphunterlabs.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gaphunterlabs.dev/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        root /var/www/gaphunterlabs/public;
        index index.html;

        access_log /var/log/nginx/gaphunterlabs.access.log combined;
        error_log  /var/log/nginx/gaphunterlabs.error.log warn;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://api_backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 90s;
        }

        location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        location /health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
